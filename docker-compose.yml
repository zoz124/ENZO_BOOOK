services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booknest-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-BookNest!Dev2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - booknest-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booknest-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development is what enables migrate+seed at startup in this project.
      ASPNETCORE_ENVIRONMENT: "Development"
      Database__MigrateAndSeed: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BookNestDb;User Id=sa;Password=${SQL_SA_PASSWORD:-BookNest!Dev2026};TrustServerCertificate=true;MultipleActiveResultSets=true"
      # Demo admin: change these before exposing the container anywhere.
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@booknest.local}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-Bk!Demo2026#Pass}"
      Seed__CustomerEmail: "${SEED_CUSTOMER_EMAIL:-customer@booknest.local}"
      Seed__CustomerPassword: "${SEED_CUSTOMER_PASSWORD:-Customer!2026}"
    ports:
      - "8080:8080"
    volumes:
      - booknest-uploads:/app/wwwroot/uploads
      - booknest-logs:/app/logs

volumes:
  booknest-sql:
  booknest-uploads:
  booknest-logs:
